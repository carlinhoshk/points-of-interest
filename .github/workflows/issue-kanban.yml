name: issue-kanban

# Adiciona issues no GitHub Projects v2 e define status

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Adicionar issue ao Project
        id: add_item
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_ID: ${{ secrets.PROJECT_V2_ID }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: |
          # Adiciona a issue e captura o ID do item criado
          RESULT=$(gh api graphql -f query='
            mutation($project:ID!, $issue:ID!) {
              addProjectV2ItemById(input: {
                projectId: $project
                contentId: $issue
              }) {
                item {
                  id
                }
              }
            }' -f project="$PROJECT_ID" -f issue="$ISSUE_ID")
          
          ITEM_ID=$(echo "$RESULT" | jq -r '.data.addProjectV2ItemById.item.id')
          echo "item_id=$ITEM_ID" >> $GITHUB_OUTPUT
          echo " Issue adicionada! Item ID: $ITEM_ID"

      - name: Definir status (opcional)
        if: ${{ secrets.PROJECT_V2_STATUS_FIELD_ID && secrets.PROJECT_V2_STATUS_OPTION_ID }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_ID: ${{ secrets.PROJECT_V2_ID }}
          ITEM_ID: ${{ steps.add_item.outputs.item_id }}
          FIELD_ID: ${{ secrets.PROJECT_V2_STATUS_FIELD_ID }}
          OPTION_ID: ${{ secrets.PROJECT_V2_STATUS_OPTION_ID }}
        run: |
          gh api graphql -f query='
            mutation($item:ID!, $field:ID!, $option:String!) {
              updateProjectV2ItemFieldValue(input: {
                itemId: $item
                fieldId: $field
                value: {singleSelectOptionId: $option}
              }) {
                projectV2Item {
                  id
                }
              }
            }' -f item="$ITEM_ID" -f field="$FIELD_ID" -f option="$OPTION_ID"
          
          echo " Status definido com sucesso!"